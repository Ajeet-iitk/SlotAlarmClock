# Builds a ready-to-install debug APK on GitHub's servers, so the
# machine you are sitting at never needs Java, the Android SDK or
# Android Studio installed.
#
# It runs automatically every time the project is pushed, and can also
# be run by hand from the repository's "Actions" tab.
name: Build debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install the API 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make the Gradle wrapper runnable
        run: chmod +x ./gradlew

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Publish the APK for download
        uses: actions/upload-artifact@v4
        with:
          # The downloaded file is named after this.
          name: slot-alarm-clock-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
