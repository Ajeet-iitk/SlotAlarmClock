# Builds a ready-to-install debug APK on GitHub's servers, so the
# machine you are sitting at never needs Java, the Android SDK or
# Android Studio installed.
#
# It runs automatically every time the project is pushed, and can also
# be run by hand from the repository's "Actions" tab.
#
# NOTE on the setup steps: GitHub's Ubuntu 24.04 runner image already
# ships JDK 17, the Android SDK (ANDROID_HOME=/usr/local/lib/android/sdk),
# platform android-36 and build-tools 36.0.0. There is deliberately NO
# "install the Android SDK" action here — adding one is both redundant
# and, as it turned out, the exact thing that was breaking this build.
#
# The runner label is pinned to ubuntu-24.04 rather than ubuntu-latest
# because "latest" migrates to Ubuntu 26 on 2026-10-19.
name: Build debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the debug APK
        # The compiler output is teed to build.log so that, when the build
        # fails, the interesting lines can be re-emitted as annotations.
        # Annotations are readable through the API without owning the repo,
        # which is what keeps the diagnosis loop short.
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Compiler errors"
            grep -E "^e: |^w: |What went wrong|> Task .*FAILED|Could not (resolve|find|determine|download)|Unresolved reference" build.log \
              | head -40 \
              | while IFS= read -r line; do
                  echo "::error title=build::$line"
                done
            echo "::endgroup::"
          fi
          exit "$status"

      - name: List the built APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Publish the APK for download
        uses: actions/upload-artifact@v7
        with:
          name: slot-alarm-clock-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
